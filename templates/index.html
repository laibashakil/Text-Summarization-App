<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarization App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { border-radius: 12px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); }
        pre { background: #eef; padding: 10px; border-radius: 5px; }
        .spinner-border { display: none; margin: 10px auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4">
            <h2 class="text-center text-primary">Text Summarization Tool</h2>
            <form id="summary-form">
                <div class="mb-3">
                    <label for="text" class="form-label">Text to summarize:</label>
                    <textarea id="text" class="form-control" rows="5" placeholder="Enter your text here..."></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="num_sentences" class="form-label">Number of Sentences:</label>
                        <input type="number" id="num_sentences" class="form-control" value="3" min="1">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="summary_type" class="form-label">Summary Type:</label>
                        <select id="summary_type" class="form-select">
                            <option>Extractive</option>
                            <option>Abstractive</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="context_filter" class="form-label">Contextual Filter:</label>
                        <select id="context_filter" class="form-select">
                            <option>None</option>
                            <option>Negative Sentiment</option>
                            <option>Positive Sentiment</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="output_format" class="form-label">Output Format:</label>
                        <select id="output_format" class="form-select">
                            <option>Text</option>
                            <option>JSON</option>
                            <option>Markdown</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn btn-primary w-100" onclick="submitSummary()">Summarize</button>
            </form>
            
            <div class="text-center mt-3">
                <div class="spinner-border text-primary" id="loading-spinner" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            
            <div class="mt-4" id="response"></div>
        </div>
    </div>

    <script>
        function submitSummary() {
            const text = document.getElementById("text").value;
            const num_sentences = document.getElementById("num_sentences").value;
            const summary_type = document.getElementById("summary_type").value;
            const context_filter = document.getElementById("context_filter").value;
            const output_format = document.getElementById("output_format").value;
            
            const spinner = document.getElementById("loading-spinner");
            spinner.style.display = "block";
            document.getElementById("response").innerHTML = "";

            fetch('/summarize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, num_sentences, summary_type, context_filter, output_format })
            })
            .then(response => response.json())
            .then(data => {
                let output = "";
                if (output_format === "JSON") {
                    output = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else if (output_format === "Markdown") {
                    output = `<pre>${data.summary}</pre>`;
                } else {
                    output = `<div class='alert alert-info'><strong>Summary:</strong> ${data.summary}</div>`;
                }
                
                if (data.audio_file) {
                    output += `<audio controls class='mt-2'><source src="${data.audio_file}" type="audio/mp3"></audio>`;
                }
                document.getElementById("response").innerHTML = output;
            })
            .catch(error => console.error('Error:', error))
            .finally(() => {
                spinner.style.display = "none";
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
